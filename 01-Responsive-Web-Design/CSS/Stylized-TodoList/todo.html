<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="todo.css" />
  </head>

  <body>
    <main>
      <h1>My To-Do List</h1>
      <ul class="todo-list">
        <li>
          <input type="checkbox" id="dsa" />
          <label for="dsa">Learn DSA</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://youtube.com/playlist?list=PL9gnSGHSqcnr_DxHsP7AW9ftq0AtAyYqJ&si=stW6zQS9tT_-gAIG"
                target="_blank"
                >DSA playlist</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="web" />
          <label for="web">Learn Web Development</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org/learn"
                target="_blank"
                >Resource Link</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="ca" />
          <label for="ca">Study about the current trends and technology</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://chatgpt.com/"
                target="_blank"
                >ChatGPT link</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="cf" />
          <label for="cf">Learn Computer Fundamentals</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org/learn"
                target="_blank"
                >Resource Link</a
              >
            </li>
          </ul>
        </li>
      </ul>
    </main>
  </body>
</html>
