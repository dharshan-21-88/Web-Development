<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="job.css" />
  </head>
  <body>
    <div class="container">
      <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" />
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" />
        <label for="position">Position:</label>
        <select id="position">
          <option>Select your position</option>
        </select>

        <fieldset class="radio-group" name="availability">
          <input type="radio" name="availability" id="ft" />
          <label for="ft">Full Time</label>
          <input type="radio" name="availability" id="pt" />
          <label for="pt">Part Time</label>
        </fieldset>
        <label for="message">Why do you want this job?</label>
        <textarea id="message"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
